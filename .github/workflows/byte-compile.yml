name: CI

on:
  pull_request:
    branches: [main, no-packages]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '29.4'

      - name: Check balanced parens on all .el files
        run: |
          failed=0
          for f in *.el test/*.el; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            if ! emacs --batch --visit="$f" --eval '(check-parens)' 2>&1; then
              echo "FAILED: $f"
              failed=1
            fi
          done
          [ "$failed" = "0" ] || exit 1

  prefixes:
    name: Prefix checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1', '31.1']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Check the key prefix declarations
        run: emacs --batch -l test/init-tests.el -f ert-run-tests-batch-and-exit

  compile:
    name: Byte-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1', '31.1']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile
        run: emacs --batch -l test/compile.el
