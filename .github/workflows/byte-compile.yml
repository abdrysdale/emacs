name: CI

on:
  pull_request:
    branches: [main, no-packages]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '29.4'

      - name: Check balanced parens on all .el files
        run: |
          failed=0
          for f in *.el test/*.el; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            if ! emacs --batch --visit="$f" --eval '(check-parens)' 2>&1; then
              echo "FAILED: $f"
              failed=1
            fi
          done
          [ "$failed" = "0" ] || exit 1

  prefixes:
    name: Prefix checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1', '31.1']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Check the key prefix declarations
        run: emacs --batch -l test/init-tests.el -f ert-run-tests-batch-and-exit

  compile:
    name: Byte-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1', '31.1']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile
        run: emacs --batch -l test/compile.el

  load:
    name: Load (${{ matrix.emacs_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['30.1', '31.1']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Build dependencies for vterm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libtool-bin

      - name: Restore the package and straight caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.emacs.d/elpa
            ~/.emacs.d/straight
          key: load-${{ matrix.emacs_version }}-${{ hashFiles('init.el') }}
          restore-keys: |
            load-${{ matrix.emacs_version }}-

      - name: Install the config into ~/.emacs.d
        run: |
          mkdir -p ~/.emacs.d ~/Documents/notes ~/Documents/notes/paper-notes ~/Documents/resources/papers
          cp init.el hl7.el abbrevs.el gptel-*.el ~/.emacs.d/
          touch ~/Documents/notes/agenda.org ~/Documents/notes/reading-list.org ~/Documents/notes/refs.bib

      - name: Install packages
        run: |
          cd ~/.emacs.d
          emacs --batch -l "$GITHUB_WORKSPACE/test/install.el"

      - name: Load init.el
        run: emacs --batch -l "$GITHUB_WORKSPACE/test/load.el"
